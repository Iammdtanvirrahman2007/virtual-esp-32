<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virtual ESP32 Rover Lab</title><style>
body{margin:0;background:#0b1020;color:#e8eefc;font:14px system-ui}header{padding:15px 20px;background:#111a30;border-bottom:1px solid #293552;display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:1.3fr .9fr;gap:14px;padding:14px}.card{background:#111a30;border:1px solid #293552;border-radius:12px;overflow:hidden}.head{padding:11px 14px;border-bottom:1px solid #293552;font-weight:700}.body{padding:12px}.small{color:#8fa1c5;font-size:12px}canvas{width:100%;height:460px;background:#07101c}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kv{display:grid;grid-template-columns:1fr auto;gap:7px;font-size:13px}.pill{padding:4px 9px;border-radius:99px;background:#263653}.ok{color:#63e39a}.warn{color:#ffd166}.code,.log{background:#080d18;padding:10px;overflow:auto;font:12px ui-monospace,monospace}.code{height:240px}.log{height:150px}.trace{background:#17233b;border-radius:8px;padding:9px;font:12px ui-monospace,monospace}svg{width:100%;height:210px;background:#080f1b}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body>
<header><b>🤖 Virtual ESP32 Rover Lab</b><span id="status" class="pill">OFFLINE</span></header>
<div class="grid"><section class="card"><div class="head">LIVE WORLD MAP <span class="small">600×400 cm · 20 cm grid</span></div><canvas id="map" width="900" height="600"></canvas><div class="body cols"><div class="kv"><span>Position</span><b id="pos">--</b><span>Heading</span><b id="heading">--</b><span>Front sensor</span><b id="front">--</b></div><div class="kv"><span>Motor L</span><b id="ml">--</b><span>Motor R</span><b id="mr">--</b><span>Battery</span><b id="bat">--</b></div></div></section>
<section class="card"><div class="head">CLAUDE-ROBOT → VIRTUAL ESP32</div><div class="body"><div id="trace" class="trace">Waiting for telemetry…</div><h4>Firmware / execution model</h4><div class="code" id="code"></div><h4>Virtual circuit</h4><svg viewBox="0 0 700 210"><rect x="20" y="55" width="170" height="100" rx="12" fill="none" stroke="#6e82aa"/><text x="105" y="82" text-anchor="middle" fill="#e8eefc">ESP32</text><text x="105" y="108" text-anchor="middle" fill="#93a3c7">TCP / UDP</text><text x="105" y="134" text-anchor="middle" fill="#93a3c7">Firmware</text><rect x="265" y="40" width="170" height="130" rx="12" fill="none" stroke="#6e82aa"/><text x="350" y="68" text-anchor="middle" fill="#e8eefc">Motor Driver</text><text x="350" y="96" text-anchor="middle" fill="#93a3c7">PWM L / R</text><text x="350" y="122" text-anchor="middle" fill="#93a3c7">DIR L / R</text><text x="350" y="148" text-anchor="middle" fill="#93a3c7">Differential drive</text><rect x="510" y="55" width="170" height="100" rx="12" fill="none" stroke="#6e82aa"/><text x="595" y="82" text-anchor="middle" fill="#e8eefc">Ultrasonic</text><text x="595" y="108" text-anchor="middle" fill="#93a3c7">TRIG / ECHO</text><text x="595" y="134" text-anchor="middle" fill="#93a3c7">front_distance</text><path d="M190 105H265M435 105H510" stroke="#63e39a" stroke-width="3"/></svg><h4>Execution log</h4><div id="log" class="log"></div></div></section></div>
<script>
var P=new URLSearchParams(location.search),BRIDGE=P.get('bridge')||'http://127.0.0.1:8000',ID=P.get('id')||'VESP32-01',E=function(x){return document.getElementById(x)},C=E('map').getContext('2d');
E('code').textContent='# Claude-Robot -> bridge -> TCP -> virtual firmware\\n\\nCOMMAND FORWARD 40\\nCOMMAND TURN_LEFT 90\\nCOMMAND STOP 0\\n\\n# Firmware maps commands to motor_l / motor_r.\\n# Physics updates pose, sensor and collision state.';
function draw(w){var W=900,H=600,s=Math.min(W/w.width,H/w.height),ox=(W-w.width*s)/2,oy=(H-w.height*s)/2;C.clearRect(0,0,W,H);C.save();C.translate(ox,oy);C.scale(s,s);C.strokeStyle='#263a5f';C.lineWidth=1;for(var x=0;x<=w.width;x+=w.cell){C.beginPath();C.moveTo(x,0);C.lineTo(x,w.height);C.stroke()}for(var y=0;y<=w.height;y+=w.cell){C.beginPath();C.moveTo(0,y);C.lineTo(w.width,y);C.stroke()}C.strokeStyle='#52688f';C.lineWidth=4;C.strokeRect(0,0,w.width,w.height);C.fillStyle='#52617f';(w.obstacles||[]).forEach(function(o){C.fillRect(o.x,o.y,o.w,o.h)});var r=w.robot||{x:0,y:0,heading:0};C.save();C.translate(r.x,r.y);C.rotate((r.heading||0)*Math.PI/180);C.fillStyle='#63d9ff';C.beginPath();C.moveTo(14,0);C.lineTo(-10,-8);C.lineTo(-10,8);C.closePath();C.fill();C.restore();if((w.path||[]).length){C.strokeStyle='#63e39a';C.lineWidth=2;C.beginPath();w.path.forEach(function(p,i){i?C.lineTo(p.x,p.y):C.moveTo(p.x,p.y)});C.stroke()}C.restore()}
async function poll(){try{var w=await fetch(BRIDGE+'/api/robot/world?id='+encodeURIComponent(ID)).then(function(r){return r.json()});if(w){draw(w);E('pos').textContent=(w.robot.x||0).toFixed(1)+', '+(w.robot.y||0).toFixed(1)+' cm';E('heading').textContent=(w.robot.heading||0).toFixed(0)+'°';E('front').textContent=(w.frontDistance==null?'--':w.frontDistance+' cm');E('ml').textContent=(w.motorL==null?'--':w.motorL+'%');E('mr').textContent=(w.motorR==null?'--':w.motorR+'%');E('bat').textContent=(w.battery==null?'--':w.battery+'%');E('status').textContent='LIVE';E('status').className='pill ok'}}catch(e){E('status').textContent='BRIDGE OFFLINE';E('status').className='pill warn'}}setInterval(poll,500);poll();
try{var es=new EventSource(BRIDGE+'/api/robot/events?id='+encodeURIComponent(ID));es.onmessage=function(e){var m=JSON.parse(e.data),l=document.createElement('div');if(m.kind==='telemetry'){var s=m.state||{};E('trace').textContent='ESP32 telemetry ← '+(s.currentCommand||'IDLE')+' | '+JSON.stringify(s.sensors||{});l.textContent=new Date().toLocaleTimeString()+' telemetry '+JSON.stringify(s)}else if(m.kind==='log'){l.textContent=m.line&&m.line.text||''}else{return}E('log').prepend(l)}}catch(e){}
</script></body></html>
